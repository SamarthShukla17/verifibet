name: anchor

on:
  push:
  pull_request:

env:
  SOLANA_VERSION: "1.18.17"
  ANCHOR_VERSION: "0.30.1"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anchor
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + git + anchor-cli binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/anchor
            ~/.local/share/solana/install
          key: ${{ runner.os }}-cargo-solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}

      - name: Install Solana CLI
        run: |
          if ! command -v solana >/dev/null 2>&1; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          if ! command -v anchor >/dev/null 2>&1; then
            cargo install --git https://github.com/coral-xyz/anchor --tag v${ANCHOR_VERSION} anchor-cli --locked
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up a local Solana wallet
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json

      # Both the `--no-idl` builds and the `--tools-version v1.52` on-chain
      # build are required workarounds documented in CLAUDE.md: this
      # anchor-cli's own IDL-generation pass fails under this toolchain
      # (ark-bn254/ark-ff-macros vs. the CLI's hardcoded
      # `--cfg procmacro2_semver_exempt`), and platform-tools' bundled cargo
      # is too old to parse a modern Cargo.lock — see
      # anchor/scripts/test-local.sh and the "Known toolchain issue" section
      # of CLAUDE.md for the full explanation.
      - name: Build + test (localnet, mock TxLINE CPI)
        run: ./scripts/test-local.sh
