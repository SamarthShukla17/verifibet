[package]
name = "verifibet"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "verifibet"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Off by default and never part of the submission build — see the doc
# comment on `instructions::resolve_market::resolve_market_attested`.
manual-fallback = []
# Off by default; only ever passed to `anchor test`'s local-validator build
# (anchor/scripts/test-local.sh) — see the doc comment above
# `declare_program!` in lib.rs. Points `resolve_market`'s CPI at
# `mock-txline` instead of TxLINE's real devnet program, which doesn't
# exist on a local validator.
test-mock-txline = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
# token_2022 is required to build with the idl-build feature even though we
# only use classic SPL Token types (Mint/TokenAccount below): anchor-spl
# 0.30.1's idl_build.rs unconditionally references
# `crate::token_interface::{Mint,TokenAccount}`, which only exist when
# token_2022 is enabled — see NOTES.md.
anchor-spl = { version = "0.30.1", default-features = false, features = ["associated_token", "mint", "token", "token_2022"] }
